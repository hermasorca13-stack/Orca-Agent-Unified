version: '3.9'

services:
  orca-bot:
    build: .
    container_name: orca-agent-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - RUN_MODE=production
      - TZ=UTC
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; r=urllib.request.urlopen('https://api.telegram.org/bot'+open('/app/.env').read().split('TELEGRAM_BOT_TOKEN=')[1].split()[0]+'/getMe', timeout=4); d=json.loads(r.read()); assert d.get('ok')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
