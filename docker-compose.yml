version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/orca-agent
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - MANUS_API_KEY=${MANUS_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongo
    volumes:
      - ./logs:/app/logs
    networks:
      - orca-network

  mongo:
    image: mongo:6.0-alpine
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DB=orca-agent
    volumes:
      - mongo-data:/data/db
    networks:
      - orca-network

volumes:
  mongo-data:

networks:
  orca-network:
    driver: bridge
