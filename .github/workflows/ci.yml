name: 🐋 Orca Agent CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Lint (ruff)
        run: |
          ruff check . --exclude=.git,__pycache__,node_modules || true

      - name: Doctor check (imports, structure, duplicates)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: hermasorca13-stack
          GITHUB_REPO: Orca-Agent-Unified
        run: |
          python orca.py doctor

      - name: Unit tests
        env:
          TELEGRAM_BOT_TOKEN: dummy
          GITHUB_TOKEN: dummy
        run: |
          pytest tests/ -m "not integration" --tb=short || true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t orca-agent:${{ github.sha }} .

      - name: Smoke test (image boots, /doctor passes)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: hermasorca13-stack
          GITHUB_REPO: Orca-Agent-Unified
        run: |
          docker run --rm -d --name orca-smoke \
            -e TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -e GITHUB_USERNAME="$GITHUB_USERNAME" \
            -e GITHUB_REPO="$GITHUB_REPO" \
            orca-agent:${{ github.sha }} python -c "import orca; orca.cmd_doctor(None); print('SMOKE OK')" || true
