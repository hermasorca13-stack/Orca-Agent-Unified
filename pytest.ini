[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
asyncio_mode = auto
markers =
    integration: requires real network/credentials
    slow: takes more than 5s
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
